<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#8b5cf6" />
    <title>EcoRide+ - AI-Enhanced Ride Booking Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Register service worker only in production to avoid dev caching issues
      if (import.meta.env && import.meta.env.PROD && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.error('Service worker registration failed:', err);
          });
        });
      } else {
        // In development, ensure any existing SW is unregistered to prevent stale caches
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then((regs) => {
            regs.forEach((reg) => reg.unregister());
          }).catch(() => {});
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
